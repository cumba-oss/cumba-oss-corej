Core:
  Id: "CDISC-AD0205"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a subject, DM has a value for AGEU and ADSL.AGEU\
  \ does not equal that value"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Match_Datasets:
- Name: "DM"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    var_exists(DM.AGEU) and AGEU != DM.AGEU
Outcome:
  Message: "For this subject, ADSL.AGEU does not equal DM.AGEU"
  Output_Variables:
  - "AGEU"
  - "DM.AGEU"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR205"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR205"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR205"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR205"
        Version: "1"
      Version: "5.0"
