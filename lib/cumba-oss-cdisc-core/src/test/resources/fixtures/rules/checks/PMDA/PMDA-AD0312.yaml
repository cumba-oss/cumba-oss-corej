Core:
  Id: "PMDA-AD0312"
  Status: "Published"
  Version: "1"
Description: "Raise an error when a populated SMQzzSC (Standardized MedDRA Query scope)\
  \ value is neither BROAD nor NARROW."
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "OCCURRENCE DATA STRUCTURE"
  Subclasses:
    Include:
    - "ADVERSE EVENT"
Check:
  expression: >-
    varname() =~ /^SMQ(0[1-9]|[1-9][0-9])SC$/ and not empty(value()) and value() not in ["BROAD",
    "NARROW"]
Outcome:
  Message: "SMQzzSC value must be BROAD, NARROW or empty."
  Output_Variables:
  - "variable_name"
  - "variable_value"
