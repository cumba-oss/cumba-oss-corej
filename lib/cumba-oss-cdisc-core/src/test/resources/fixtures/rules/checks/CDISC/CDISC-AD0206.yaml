Core:
  Id: "CDISC-AD0206"
  Status: "Published"
  Version: "1"
Description: "Raise an error when, for a subject, DM has a value for SEX and ADSL.SEX\
  \ does not equal that value"
Executability: "Fully Executable"
Scope:
  Data_Structures:
    Include:
    - "SUBJECT LEVEL ANALYSIS DATASET"
Match_Datasets:
- Name: "DM"
  Keys:
  - "USUBJID"
Check:
  expression: >-
    var_exists(DM.SEX) and SEX != DM.SEX
Outcome:
  Message: "For this subject, ADSL.SEX does not equal DM.SEX"
  Output_Variables:
  - "SEX"
  - "DM.SEX"
Standards:
- Organization: "CDISC"
  Standards:
  - Name: "ADaMIG"
    Version: "1.0"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR206"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.1"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR206"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.2"
    References:
    - Origin: "ADaM Conformance Rules"
      Rule_Identifier:
        Id: "CR206"
        Version: "1"
      Version: "5.0"
  - Name: "ADaMIG"
    Version: "1.3"
    References:
